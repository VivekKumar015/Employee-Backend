# DATABASE — values come from Render environment variables
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/employee_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA — auto-creates tables from your Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# SERVER — Render injects PORT automatically
server.port=${PORT:8080}